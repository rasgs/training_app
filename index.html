<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121311">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ladder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Ladder</h1>
    <span class="topbar-meta" id="topbar-meta"></span>
  </header>

  <main id="view" class="view"></main>

  <div id="rest" class="rest" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <nav class="tabs" id="tabs">
    <button data-act="tab" data-tab="workout"><span class="tab-ico">●</span>Workout</button>
    <button data-act="tab" data-tab="prs"><span class="tab-ico">★</span>PRs</button>
    <button data-act="tab" data-tab="history"><span class="tab-ico">◷</span>History</button>
    <button data-act="tab" data-tab="settings"><span class="tab-ico">⚙</span>Settings</button>
  </nav>

  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="timer" class="timer" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
